# Projet fixture minimal : une app SwiftUI à deux écrans + un target SnapshotTests qui utilise PlatformSnapshot.
# Générer le .xcodeproj (non versionné) : `cd Fixture && xcodegen generate`
name: SnapshotFixture
options:
  bundleIdPrefix: com.baptcave.fixture
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
packages:
  PlatformSnapshot:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  FixtureApp:
    type: application
    platform: iOS
    sources:
      - FixtureApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baptcave.fixture.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SnapshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SnapshotTests
      - Shared
    dependencies:
      - target: FixtureApp
      - package: PlatformSnapshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baptcave.fixture.snapshottests
        TEST_TARGET_NAME: FixtureApp
schemes:
  FixtureApp:
    build:
      targets:
        FixtureApp: all
        SnapshotTests: [test]
    test:
      targets:
        - SnapshotTests
